<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Media Downloader</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: linear-gradient(135deg, #1e3a8a, #2563eb, #60a5fa);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.container {
  width: 420px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  text-align: center;
}

h1 {
  margin-bottom: 20px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-bottom: 15px;
  font-size: 14px;
}

select {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-bottom: 15px;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  background: #00c6ff;
  color: white;
  transition: 0.3s;
}

button:hover {
  background: #0072ff;
}

.preview {
  margin-top: 20px;
  display: none;
}

.preview img {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 10px;
}

.title {
  font-size: 14px;
  margin-bottom: 10px;
}

.loader {
  display: none;
  margin-top: 15px;
}

.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #ff4b4b;
  padding: 10px 15px;
  border-radius: 8px;
  display: none;
}
</style>
</head>

<body>

<div class="container">
  <h1>Media Downloader</h1>

  <input type="text" id="url" placeholder="Paste link here..." />

  <select id="format">
    <option value="mp4">MP4 (Video)</option>
    <option value="mp3">MP3 (Audio)</option>
  </select>

  <button onclick="downloadMedia()">Download</button>

  <div class="loader" id="loader">Processing...</div>

  <div class="preview" id="preview">
    <img id="thumb" src="" />
    <div class="title" id="videoTitle"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const urlInput = document.getElementById("url");
const formatSelect = document.getElementById("format");
const preview = document.getElementById("preview");
const thumb = document.getElementById("thumb");
const videoTitle = document.getElementById("videoTitle");
const loader = document.getElementById("loader");
const toast = document.getElementById("toast");

/* ========================= */
/* Detect YouTube */
/* ========================= */

urlInput.addEventListener("input", () => {
  const url = urlInput.value;

  if (url.includes("youtube.com") || url.includes("youtu.be")) {
    formatSelect.style.display = "block";
    showThumbnail(url);
  } else {
    formatSelect.style.display = "none";
    preview.style.display = "none";
  }
});

/* ========================= */
/* Get YouTube Thumbnail */
/* ========================= */

function extractVideoID(url) {
  const regExp =
    /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?v=))([^#&?]*).*/;
  const match = url.match(regExp);
  return match && match[7].length === 11 ? match[7] : null;
}

function showThumbnail(url) {
  const id = extractVideoID(url);
  if (!id) return;

  thumb.src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
  preview.style.display = "block";
}

/* ========================= */
/* Toast */
/* ========================= */

function showToast(message) {
  toast.innerText = message;
  toast.style.display = "block";
  setTimeout(() => {
    toast.style.display = "none";
  }, 3000);
}

/* ========================= */
/* Download */
/* ========================= */

async function downloadMedia() {
  const url = urlInput.value;
  const format = formatSelect.value;

  if (!url) return showToast("URL tidak boleh kosong");

  loader.style.display = "block";

  try {
    const res = await fetch("/api/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, format }),
    });

    const result = await res.json();
    loader.style.display = "none";

    if (!result.success) {
      return showToast(result.message);
    }

    preview.style.display = "block";

    if (result.thumbnail) {
      thumb.src = result.thumbnail;
    }

    const a = document.createElement("a");
    a.href = result.download;
    a.download = result.title + "." + result.extension;
    document.body.appendChild(a);
    a.click();
    a.remove();

  } catch (err) {
    loader.style.display = "none";
    showToast("Gagal mengunduh media");
  }
}
</script>

</body>
</html>
